</header><main id="main" class="doc-main qna"><h1>답변 관리</h1><p class="article-intro">등록한 기기에서 지문·얼굴 인식으로 들어가요.</p>
<div id="login" class="qna-form qna-login">
  <button class="btn btn-primary qna-passkey" type="button" id="signin">지문·얼굴로 들어가기</button>
  <p class="qna-status" id="login-status" role="status" aria-live="polite"></p>
  <details class="qna-first" id="first">
    <summary>처음이거나 새 기기예요</summary>
    <form id="keyform" class="qna-keyform" autocomplete="off">
      <p class="qna-note">이 기기를 처음 등록할 때 한 번만 주인 키가 필요해요. 등록한 뒤에는 지문·얼굴로 들어가요. 이미 로그인한 기기가 있으면 그 기기의 「기기」 탭에서 키 없이 추가할 수도 있어요.</p>
      <label class="qna-field"><span>주인 키</span><input name="key" type="password" autocomplete="current-password" spellcheck="false" placeholder="주인 키를 붙여 넣으세요"></label>
      <div class="qna-actions"><button class="btn btn-primary" type="submit" data-mode="register">이 기기 등록하기</button><button class="btn btn-ghost" type="submit" data-mode="key">키로만 들어가기</button></div>
    </form>
  </details>
</div>
<section id="panel" hidden>
  <div class="qna-tabs" role="tablist">
    <button type="button" role="tab" data-filter="pending" aria-selected="true">답변 대기 <b id="c-pending">0</b></button>
    <button type="button" role="tab" data-filter="answered" aria-selected="false">답변함 <b id="c-answered">0</b></button>
    <button type="button" role="tab" data-filter="hidden" aria-selected="false">숨김 <b id="c-hidden">0</b></button>
    <button type="button" role="tab" data-filter="devices" aria-selected="false">기기</button>
    <button type="button" class="qna-logout" id="logout">로그아웃</button>
  </div>
  <p class="qna-status" id="panel-status" role="status" aria-live="polite"></p>
  <div id="items" class="qna-list"></div>
</section>
</main>
<script src="assets/qna-admin.js?v=2" defer></script>
</body></html>
