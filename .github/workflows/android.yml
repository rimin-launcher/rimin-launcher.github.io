name: Build Sealion One apps

on:
  push:
    paths: ['vehicle-launcher/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['vehicle-launcher/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vehicle-launcher
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:test :launcher:testDebugUnitTest
      - name: Lint and build debug APKs
        run: ./gradlew lintDebug :launcher:assembleDebug :phone:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sealion-one-debug-apks
          path: |
            vehicle-launcher/launcher/build/outputs/apk/debug/*.apk
            vehicle-launcher/phone/build/outputs/apk/debug/*.apk
